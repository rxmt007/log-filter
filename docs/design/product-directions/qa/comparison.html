<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogFilter 产品方向原型 · 设计对照</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e7e9ed; color: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 16px; }
    main { display: grid; grid-template-columns: repeat(2, 590px); gap: 16px; width: 1196px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d5d8dd; border-radius: 9px; background: #fff; }
    .label { height: 40px; display: flex; align-items: center; padding: 0 12px; background: #f1f2f4; border-bottom: 1px solid #d5d8dd; }
    .label span { margin-left: auto; color: #6b7280; font: 500 11px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    img { display: block; width: 590px; height: 430px; }
  </style>
</head>
<body>
  <main>
    <figure>
      <div class="label">权威 LogWindow 设计稿 <span>1180 × 860 · light</span></div>
      <img src="source-logwindow-1180x860.png" alt="权威 LogWindow 设计稿">
    </figure>
    <figure>
      <div class="label">代表性调查闭环原型 <span>1180 × 860 · light · initial</span></div>
      <img src="implementation-investigation-loop-1180x860.png" alt="代表性调查闭环原型">
    </figure>
  </main>
</body>
</html>
