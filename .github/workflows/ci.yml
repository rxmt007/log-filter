# 三系统 CI 门禁:测试 + fmt + clippy + 前端检查。
# 触发收缩(控制计费分钟,macOS 按 10x 计):
# - PR:只跑 Ubuntu + Windows(Windows 无本地验证必须保留;macOS 即开发机,PR 阶段边际价值最低)
# - main push:完整三系统(合并后最终安全网)
# - 纯文档变更(docs/**, *.md)不触发;裸分支 push 不触发(仅 PR / main / 手动)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 在 Linux 上编译需要 webkit2gtk 4.1 等系统库
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # pnpm 版本读取 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: cargo fmt --all -- --check
      - run: cargo test -p logcore
      - run: cargo test -p log-filter
      - run: cargo clippy --workspace --all-targets -- -D warnings
