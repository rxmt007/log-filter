# 三系统 CI 门禁:dev 为日常缓冲分支(不跑 CI,依赖本地全套验证);
# 只有 dev→main 的批量 PR 触发完整三系统矩阵(含 macOS,与贡献者开发机无关);
# rebase 合并绿 PR 后内容与已测树一致,故 main push 不再重复跑;手动触发兜底。
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 在 Linux 上编译需要 webkit2gtk 4.1 等系统库
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # pnpm 版本读取 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: cargo fmt --all -- --check
      - run: cargo test -p logcore
      - run: cargo test -p log-filter
      - run: cargo clippy --workspace --all-targets -- -D warnings
