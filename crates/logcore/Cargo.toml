[package]
name = "logcore"
version = "0.1.0"
description = "Core indexing, filtering, and search engine for LogFilter"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/rxmt007/log-filter"

[dependencies]
encoding_rs = "0.8"
memmap2 = "0.9"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
