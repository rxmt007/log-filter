[package]
name = "logcore"
version = "0.1.1"
description = "Core indexing, filtering, and search engine for LogFilter"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/rxmt007/log-filter"

[dependencies]
blake3 = "=1.8.2"
encoding_rs = "0.8"
memmap2 = "0.9"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
